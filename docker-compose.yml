services:
  varnish:
    build: .
    command: ["/usr/sbin/varnishd", "-p", "feature=+esi_disable_xml_check", "-F", "-f", "/etc/varnish/default.vcl", "-a", ":6081", "-s", "malloc,256m"]
    privileged: true
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - ./tests/default.vcl:/etc/varnish/default.vcl
    ports:
      - "8090:6081"
    depends_on:
      - nginx
    networks:
      - testnet

  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
    networks:
      - testnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  wordpress:
    image: wordpress:6-php8.2-fpm
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./tests/backend_content/esi-check:/var/www/html/esi-check
      - .:/var/www/html/wp-content/plugins/cacheability
      - ./tests/backend_content/mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - testnet

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./tests/nginx.conf:/etc/nginx/conf.d/default.conf
      - wordpress_data:/var/www/html
      - ./tests/backend_content/esi-check:/var/www/html/esi-check
    depends_on:
      - wordpress
    networks:
      - testnet

  cli:
    image: wordpress:cli
    depends_on:
      - wordpress
      - db
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/cacheability
      - ./tests/backend_content/mu-plugins:/var/www/html/wp-content/mu-plugins
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
    user: "33:33"
    command: >
      /bin/sh -c "
        echo 'Waiting for DB to be ready...' &&
        sleep 30 &&
        echo 'Installing WordPress...' &&
        wp core install --url=http://localhost:8090 --title=Test --admin_user=admin --admin_password=admin --admin_email=test@example.com --skip-email &&
        wp plugin activate cacheability &&
        wp rewrite structure '/%postname%/' &&
        wp rewrite flush &&
        echo 'WordPress setup complete!'
      "
    networks:
      - testnet

networks:
  testnet:

volumes:
  wordpress_data:
